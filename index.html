<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Brajesh31 GitHub community dashboard">
  <title>Brajesh31 GitHub Community</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">GITHUB COMMUNITY</p>
      <h1><a id="profile-link" href="https://github.com/Brajesh31">Brajesh31</a></h1>
      <p>Follower analytics and relationship insights.</p>
    </div>
    <button id="theme-toggle" type="button" aria-label="Toggle color theme">Toggle theme</button>
  </header>
  <main>
    <section id="stats" class="stats" aria-label="Community statistics"></section>
    <section class="toolbar">
      <label>Search followers <input id="search" type="search" placeholder="Username"></label>
      <label>Filter <select id="filter"><option value="all">All followers</option><option value="mutual">Mutual</option><option value="not-followed">Not followed back</option></select></label>
    </section>
    <p id="status" role="status">Loading report...</p>
    <section id="followers" class="grid" aria-live="polite"></section>
  </main>
  <script src="src/main.js"></script>
</body>
</html>
