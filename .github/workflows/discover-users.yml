name: Discover community users
on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"
permissions:
  contents: write
concurrency:
  group: discover-users
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - name: Discover candidates
        env: {GITHUB_USERNAME: Brajesh31, MY_FOLLOWERS: "${{ secrets.MY_FOLLOWERS }}"}
        run: python get_random_users.py
      - name: Commit queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new_users_list.txt data/candidates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update community candidate queue"
          git pull --rebase origin main
          git push origin HEAD:main
