name: Deploy dashboard to GitHub Pages
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate community report"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public dashboard
        run: |
          mkdir -p _site/src _site/reports
          cp index.html Dataset.json _site/
          cp src/main.js src/style.css _site/src/
          cp reports/*.json _site/reports/
      - uses: actions/upload-pages-artifact@v3
        with: {path: "_site"}
      - id: deployment
        uses: actions/deploy-pages@v4
