name: Maintain review queue

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build queue (read-only)
        env:
          GITHUB_USERNAME: Brajesh31
          MY_FOLLOWERS: ${{ secrets.MY_FOLLOWERS }}
        run: python get_random_users.py
      - name: Commit queue changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new_users_list.txt
          if git diff --cached --quiet; then
            echo "No queue changes to commit."
          else
            git commit -m "Update community review queue"
            git push
          fi
