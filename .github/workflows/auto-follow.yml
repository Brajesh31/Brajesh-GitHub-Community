name: Follow discovered users
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
permissions:
  contents: write
concurrency:
  group: community-automation
  cancel-in-progress: false
jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - name: Follow eligible candidates
        env:
          GITHUB_USERNAME: Brajesh31
          MY_FOLLOWERS: "${{ secrets.MY_FOLLOWERS }}"
          AUTO_FOLLOW_ENABLED: "true"
          DRY_RUN: "false"
        run: python following_new_users.py
      - name: Commit action history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ new_users_list.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record follow processing"
          git pull --rebase origin main
          git push origin HEAD:main
