name: Generate community report
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"
permissions:
  contents: write
concurrency:
  group: community-automation
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - name: Generate report
        env: {GITHUB_USERNAME: Brajesh31, MY_FOLLOWERS: "${{ secrets.MY_FOLLOWERS }}"}
        run: python create_readme.py
      - name: Commit and synchronize report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Dataset.json reports/ index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update community report"
          git pull --rebase origin main
          git push origin HEAD:main
