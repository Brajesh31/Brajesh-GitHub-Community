name: Generate community report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Generate report
        env:
          GITHUB_USERNAME: Brajesh31
          MY_FOLLOWERS: ${{ secrets.MY_FOLLOWERS }}
        run: python create_readme.py
      - name: Commit report changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Dataset.json index.html reports/relationships.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update GitHub community report"
            git push
          fi
