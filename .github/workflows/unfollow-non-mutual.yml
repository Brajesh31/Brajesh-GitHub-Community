name: Unfollow eligible non-mutual accounts
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
permissions:
  contents: write
concurrency:
  group: community-automation
  cancel-in-progress: false
jobs:
  unfollow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - name: Unfollow eligible non-mutual accounts
        env:
          GITHUB_USERNAME: Brajesh31
          MY_FOLLOWERS: "${{ secrets.MY_FOLLOWERS }}"
          AUTO_UNFOLLOW_ENABLED: "true"
          DRY_RUN: "false"
        run: python unfollowing_my_unfollowers.py
      - name: Commit action history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record unfollow processing"
          git pull --rebase origin main
          git push origin HEAD:main
